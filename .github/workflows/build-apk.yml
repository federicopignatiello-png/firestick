name: Build FirePad APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract FirePad project
        run: unzip -o FirePad-Android-GitHub.zip -d firepad
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon -p firepad assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FirePad-debug-APK
          path: firepad/app/build/outputs/apk/debug/app-debug.apk
