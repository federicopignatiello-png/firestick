plugins { id 'com.android.application' }
android {
    namespace 'com.firepad.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.firepad.app'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
